<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better YT - Watch Together</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .controls {
            margin: 20px 0;
        }
        input {
            padding: 12px;
            font-size: 16px;
            margin-right: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            width: 200px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            background: #0070f3;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0051a8;
        }
        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            background: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍿 Better YT — Watch Together</h1>
        <div class="controls">
            <input type="text" id="roomInput" placeholder="Enter Room Code">
            <button onclick="joinRoom()">Join Room</button>
        </div>
        <video id="videoPlayer" controls src="https://w3schools.com"></video>
    </div>

    <script>
        function joinRoom() {
            const room = document.getElementById('roomInput').value;
            if (room) {
                alert('Joining room: ' + room);
                console.log('Room session connected via code:', room);
            } else {
                alert('Please enter a room code first.');
            }
        }
        console.log("Better YT streaming application initialized successfully.");
    </script>
</body>
</html>
