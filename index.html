cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better YT — Custom Sync Platform</title>
    <script src="https://socket.io"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f0f; color: #fff;
            min-height: 100vh; overflow-x: hidden;
        }
        #lobby {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .lobby-card {
            background: #1f1f1f; padding: 40px; border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); text-align: center; max-width: 450px; width: 100%;
        }
        input {
            padding: 14px; font-size: 16px; border-radius: 8px; border: 1px solid #3c3c3c; 
            background: #2d2d2d; color: #fff; margin: 15px 0; width: 100%; text-transform: uppercase;
        }
        button {
            padding: 14px 28px; font-size: 16px; border-radius: 8px; border: none; 
            background: #ff0000; color: #fff; font-weight: bold; cursor: pointer; width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #cc0000; }
        
        #room-view { display: none; padding: 25px; }
        .dashboard-nav {
            display: flex; justify-content: space-between; align-items: center; 
            background: #1f1f1f; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px;
        }
        .stream-input-group { display: flex; gap: 10px; width: 60%; }
        .stream-input-group input { margin: 0; text-transform: none; }
        .stream-input-group button { width: auto; background: #3a3a3a; }
        .stream-input-group button:hover { background: #4e4e4e; }
        
        .player-frame-wrapper { 
            position: relative; width: 100%; max-width: 1050px; 
            margin: 0 auto; aspect-ratio: 16/9; background: #000; 
            border-radius: 14px; overflow: hidden; box-shadow: 0 12px 50px rgba(0,0,0,0.8);
        }
        #player { width: 100%; height: 100%; pointer-events: auto; }

        .sync-cursor {
            position: fixed; width: 14px; height: 14px;
            background: #00ffcc; border-radius: 50%;
            pointer-events: none; z-index: 100000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ffcc;
            transition: transform 0.04s linear;
        }
        .cursor-tag {
            position: absolute; top: 18px; left: 12px;
            background: rgba(15, 15, 15, 0.9); color: #00ffcc;
            font-size: 11px; font-weight: bold; padding: 3px 8px; 
            border-radius: 4px; border: 1px solid #00ffcc; white-space: nowrap;
        }
        .remote-pulse {
            position: fixed; width: 40px; height: 40px;
            border: 3px solid #00ffcc; border-radius: 50%;
            pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%); 
            animation: clickWave 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes clickWave {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="lobby-card">
            <h1 style="margin: 0 0 10px 0; color: #ff0000; font-size: 36px;">🍿 Better YT</h1>
            <p style="color: #aaa; margin: 0;">Create or join a workspace using any combination of alphanumeric characters (Non-Case Sensitive)</p>
            <input type="text" id="roomCodeField" placeholder="Enter Room ID (e.g. PARTY7)" maxlength="12">
            <button onclick="joinSyncSession()">Launch Sync Room</button>
        </div>
    </div>

    <div id="room-view">
        <div class="dashboard-nav">
            <h2 id="roomDisplayLabel" style="margin: 0; font-size: 20px; color: #aaa;">Room: --</h2>
            <div class="stream-input-group">
                <input type="text" id="videoUrlField" placeholder="Paste full link, short link, or video ID">
                <button onclick="broadcastNewMedia()">Load Video</button>
            </div>
        </div>
        <div class="player-frame-wrapper">
            <div id="player"></div>
        </div>
    </div>

    <script>
        let socket;
        let player;
        let currentRoomId = "";
        let selfUserId = "Client_" + Math.floor(Math.random() * 9000 + 1000);

        function joinSyncSession() {
            let code = document.getElementById('roomCodeField').value.trim().toUpperCase();
            if (!code.match(/^[A-Z0-9]+$/)) {
                alert("Please use letters and numbers only.");
                return;
            }
            currentRoomId = code;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('room-view').style.display = 'block';
            document.getElementById('roomDisplayLabel').innerText = "📍 Active Lobby: " + currentRoomId;

            initializeWebSocketTunnel();
        }

        function initializeWebSocketTunnel() {
            socket = io(window.location.origin);
            socket.emit('join-room', { room: currentRoomId, user: selfUserId });

            window.addEventListener('mousemove', (e) => {
                socket.emit('cursor-move', {
                    room: currentRoomId, user: selfUserId,
                    x: e.clientX / window.innerWidth,
                    y: e.clientY / window.innerHeight
                });
            });

            window.addEventListener('click', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                socket.emit('cursor-click', {
                    room: currentRoomId,
                    x: e.clientX, y: e.clientY
                });
            });

            socket.on('user-moved', (data) => {
                if (data.user === selfUserId) return;
                let pointer = document.getElementById(`mouse-${data.user}`);
                if (!pointer) {
                    pointer = document.createElement('div');
                    pointer.id = `mouse-${data.user}`;
                    pointer.className = 'sync-cursor';
                    pointer.innerHTML = `<span class="cursor-tag">${data.user}</span>`;
                    document.body.appendChild(pointer);
                }
                pointer.style.left = (data.x * window.innerWidth) + 'px';
                pointer.style.top = (data.y * window.innerHeight) + 'px';
            });

            socket.on('user-clicked', (data) => {
                let wave = document.createElement('div');
                wave.className = 'remote-pulse';
                wave.style.left = data.x + 'px';
                wave.style.top = data.y + 'px';
                document.body.appendChild(wave);
                setTimeout(() => wave.remove(), 500);
            });

            socket.on('load-video', (data) => {
                if (player && player.loadVideoById) {
                    player.loadVideoById(data.videoId);
                }
            });
        }

        let tag = document.createElement('script');
        tag.src = "https://youtube.com";
        let firstScriptTag = document.getElementsByTagName('script');
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 }
            });
        }

        function broadcastNewMedia() {
            let targetString = document.getElementById('videoUrlField').value.trim();
            let videoId = extractYouTubeId(targetString);
            
            if (videoId && socket) {
                socket.emit('change-video', { room: currentRoomId, videoId: videoId });
            } else {
                alert("Could not parse a valid YouTube Video ID or Link.");
            }
        }

        // Complete regular expression fallback mechanism
        function extractYouTubeId(url) {
            if (url.length === 11) return url;
            
            // Scans the string for the explicit 11-digit character sequence following standard separators
            const regExp = /^.*(?:(?:youtu\.be\/|v\/|vi\/|u\/\w\/|embed\/|shorts\/)|(?:(?:watch)?\?v(?:i)?=|\&v(?:i)?=))([^#\&\?]*).*/;
            const match = url.match(regExp);
            
            if (match && match[1] && match[1].length === 11) {
                return match[1];
            }
            
            // Universal emergency parameter extraction rule
            const fallbackReg = /[a-zA-Z0-9_-]{11}/;
            const fallbackMatch = url.match(fallbackReg);
            return fallbackMatch ? fallbackMatch[0] : null;
        }
    </script>
</body>
</html>
EOF
